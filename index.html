<style>
/* Layout: mobile-first storefront, sticky header with search, bottom tab bar, content in a 720px column. */
:root{
  --bg:#f5f2fc; --surface:#ffffff; --ink:#1d1233; --muted:#6b6385; --line:#e3ddf2;
  --brand:#5b21d6; --brand-ink:#ffffff; --accent:#6d28d9; --accent-ink:#ffffff; --price:#d4153c; --ok:#16794c;
  --font:'Inter','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120b24; --surface:#1c1233; --ink:#efe9ff; --muted:#a99cc9; --line:#33264f;
  --brand:#2a1260; --brand-ink:#ffffff; --accent:#8b5cf6; --accent-ink:#ffffff; --price:#ff8aa0; --ok:#4cc38a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120b24; --surface:#1c1233; --ink:#efe9ff; --muted:#a99cc9; --line:#33264f;
  --brand:#2a1260; --brand-ink:#ffffff; --accent:#8b5cf6; --accent-ink:#ffffff; --price:#ff8aa0; --ok:#4cc38a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--brand-ink);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto 8px}
.logo{font-weight:700;font-size:20px;letter-spacing:.02em;flex:1;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:0}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:inline-block}
.langs{display:flex;gap:4px}
.langs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:3px 9px;font-size:13px;min-height:30px}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.search{max-width:720px;margin:0 auto;display:flex;border-radius:10px;overflow:hidden;background:var(--surface)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 14px;font-size:16px}
.search span{background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0 14px}
main{max-width:720px;margin:0 auto;padding-top:16px;display:flex;flex-direction:column;gap:20px}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.banner{border-radius:14px;padding:22px 20px;background:linear-gradient(120deg,#13293d,#1b5e6b);color:#fff;display:flex;flex-direction:column;gap:6px}
.banner b{font-size:22px;text-wrap:balance}
.banner small{opacity:.85;font-size:14px}
.banner button{align-self:flex-start;margin-top:8px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);padding:9px 16px;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;font-weight:500}
.cat svg{width:34px;height:34px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:start;padding:0}
.card .pic{aspect-ratio:1/1;display:grid;place-items:center}
.card .pic svg,.big svg{width:48%;height:48%}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .name{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.price{color:var(--price);font-weight:700;font-variant-numeric:tabular-nums}
.from{color:var(--muted);font-size:12px}
.stars{color:var(--accent);font-size:13px;letter-spacing:1px}
.fav{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#13293d;display:grid;place-items:center}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{background:var(--accent)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.big{aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;position:relative}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.offer{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.offer:first-of-type{border-top:0}
.offer small{color:var(--muted);display:block}
.tag{background:var(--ok);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px;margin-inline-start:6px}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;min-height:42px}
.btn.alt{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.5}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.crumb{background:none;border:0;color:var(--muted);padding:0;text-align:start}
.row{display:flex;gap:12px;align-items:center}
.row .thumb{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;flex:none}
.row .thumb svg{width:60%;height:60%}
.row .info{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.sum{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.sum.total{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input.f,textarea.f{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:16px;color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:flex;gap:12px;align-items:center;padding:7px 0;color:var(--muted);position:relative}
.steps li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;background:var(--surface)}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on i{background:var(--ok);border-color:var(--ok)}
.steps li.cx{opacity:.6}
.empty{text-align:center;color:var(--muted);padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.note{font-size:12px;color:var(--muted);text-align:center;padding-bottom:6px}
nav{position:fixed;bottom:0;inset-inline:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px 0;position:relative;min-height:48px}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
nav button[aria-current="page"] svg{color:var(--accent)}
.badge{position:absolute;top:0;inset-inline-start:calc(50% + 4px);background:var(--price);color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
.toast{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--brand);color:var(--brand-ink);padding:9px 16px;border-radius:99px;font-size:14px}
@media(prefers-reduced-motion:no-preference){.card,.cat{transition:transform .15s}.card:active,.cat:active{transform:scale(.98)}}
</style>
<style>
.lvbox{margin-top:8px;border:1px solid var(--line,#ddd);border-radius:12px;overflow:hidden}
.lvmap{height:210px;background:#e8eef0}
.lvinfo{padding:8px 10px}
.lvinfo b{font-weight:700}
.lvico{font-size:22px;line-height:1;background:#fff;border-radius:50%;border:2px solid #0a7;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.lvtrk{margin-top:8px;padding:10px;border-radius:12px;background:var(--soft,rgba(0,150,100,.08))}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cdin{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
#main.pgin{animation:pgin .26s cubic-bezier(.2,.7,.2,1)}
#main.pgin .card,#main.pgin .order,#main.pgin .panel,#main.pgin .cat{animation:cdin .32s cubic-bezier(.2,.7,.2,1) both}
#main.pgin .card:nth-child(2),#main.pgin .panel:nth-child(2){animation-delay:.04s}
#main.pgin .card:nth-child(3),#main.pgin .panel:nth-child(3){animation-delay:.08s}
#main.pgin .card:nth-child(4),#main.pgin .panel:nth-child(4){animation-delay:.12s}
#main.pgin .card:nth-child(n+5){animation-delay:.16s}
.card,.btn,.cat{transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease}
.card:active,.cat:active{transform:scale(.97)}
.btn:active{transform:scale(.97)}
@keyframes zin{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-7px) scale(1.3)}100%{transform:none}}
@keyframes catb{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
#main.pzoom .big{animation:zin .45s cubic-bezier(.2,.7,.2,1) both}
.pic.zoomout,.card.zoomout .pic{transform:scale(1.1);transition:transform .18s ease-in,opacity .18s;opacity:.85}
.card .pic{overflow:hidden}
.fav{z-index:3}
.fav.pop svg{animation:pop .22s ease-out}
.fav[aria-pressed="true"]{background:#f5b301;color:#fff}
.badge.bump{animation:bump .45s ease-out}
.btn.okchk{background:#1f9d55!important;color:#fff!important;transition:background .15s}
.cat.tap{animation:catb .28s ease-out}
@media (prefers-reduced-motion:reduce){#main.pgin,#main.pgin *,.fav.pop svg,.badge.bump,.cat.tap,#main.pzoom .big{animation:none!important}.card,.btn,.cat{transition:none}.card.zoomout .pic{transform:none}}
/* ---- premium home ---- */
header .search input{height:50px;font-size:16px;border-radius:16px}
.slide{aspect-ratio:16/9}
.slide span{font-size:20px;padding:34px 16px 14px;text-wrap:balance}
.banner{padding:30px 22px;border-radius:18px;min-height:170px;justify-content:center;background:linear-gradient(120deg,#0f2234,#1b5e6b)}
.banner b{font-size:26px;line-height:1.25}
.card .pic{width:100%;aspect-ratio:1/1}
.card .name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;min-height:2.7em;font-weight:600}
.card .body{gap:4px;padding:10px 12px 12px}
.card .price{font-size:18px;font-weight:800;line-height:1.2}
.card .old{display:block;color:var(--muted);text-decoration:line-through;font-size:12px;font-weight:400}
.pold{color:var(--muted);text-decoration:line-through;font-size:14px;font-weight:400;margin-inline-start:8px}
.dbadge{position:absolute;top:8px;inset-inline-start:8px;z-index:3;background:#d93025;color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 2px 10px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hsi{flex:0 0 44%;scroll-snap-align:start;display:flex}
.hsi .card{width:100%}
.hs2{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.hs2 h2{margin:0}
.hs2 button{background:none;border:0;color:var(--ink);font-weight:600;text-decoration:underline}
nav button[aria-current="page"]{background:var(--accent)!important;color:var(--accent-ink)!important;font-weight:700}
nav button[aria-current="page"] svg{color:var(--accent-ink)!important}
nav .badge{z-index:2}

 var txt="﻿"+rows.map(function(r){return r.map(function(x){var s=String(x==null?"":x);if(typeof x==="string"&&/^[=+\-@]/.test(s))s="'"+s;return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",");}).join("\r\n");
 try{

var LG={
terms:{
en:{intro:"These terms apply to everyone who uses KRP Bazar, operated by [OPERATOR NAME], [ADDRESS]. By creating an account or placing an order you accept them.",items:[
["What KRP Bazar is.","KRP Bazar is an online marketplace. Independent sellers offer products, and customers buy from them. The sale contract is between the customer and the seller. KRP Bazar provides the platform, the order system and customer service."],
["Accounts.","You must give correct name, phone number and email, and keep your password secret. You are responsible for what happens under your account. One person may hold one account."],
["Orders and prices.","Prices are in Iraqi dinar (IQD). An order is placed when you tap Place order. A seller may confirm or reject it. Prices and stock can change until the seller confirms."],
["Payment.","For now, you pay in cash when your package is delivered, directly to the seller or to the courier who delivers it. KRP Bazar does not collect the money for the goods. Other payment methods may be added later."],
["Delivery.","Each seller delivers their own packages, themselves or through their own couriers, to the address you enter. A map location is required so the seller can find you. An order with items from several sellers is delivered in several packages. Each package has its own status and delivery time, which the seller sets and which you can follow in the app, so packages may arrive on different days. Delivery is charged per seller: it is free when the items from one seller total 100,000 IQD or more and costs 3,000 IQD below that, unless the app shows otherwise. The delivery fee is paid to the seller who delivers. Check the address, map location and phone number carefully."],
["Returns and complaints.","You may return or report a problem with an order within [RETURN DAYS] days of delivery if the item is faulty, wrong or not as described. Contact support in the app (Account, Contact support)."],
["Sellers.","Sellers must register a shop, which KRP Bazar may approve, refuse or suspend. Sellers must describe products truthfully, keep stock and prices current, deliver what customers ordered and handle orders promptly. Sellers deliver the packages, collect the cash payment from the customer on delivery and pay KRP Bazar a commission on delivered sales, a fixed amount per item depending on its price (500 IQD for each started 25,000 IQD of the item price, shown in the app) unless agreed otherwise. The commission is settled with KRP Bazar as agreed with the seller."],
["Coupons.","A coupon code applies to the products of the seller it was issued for, can be used once per customer, and may expire or be withdrawn. The seller cannot use their own coupon. The discount is shared between the seller and KRP Bazar as shown in the app or agreed with the seller."],
["Forbidden items and conduct.","It is forbidden to offer illegal, stolen, counterfeit, dangerous or regulated goods without the needed permission, to post false reviews, to abuse other users or to misuse the platform. KRP Bazar may remove products and block accounts that break these rules."],
["Reviews.","Only customers with a delivered order may rate a seller. Reviews must be honest and respectful. KRP Bazar may remove reviews that break these terms."],
["Liability.","KRP Bazar takes care to run the platform properly but does not guarantee it is always available or free of errors. Sellers are responsible for their products. To the extent the law allows, KRP Bazar is not liable for losses caused by sellers, couriers or events outside its control."],
["Changes.","We may change these terms. The current version is always in the app. Continued use after a change means you accept it."],
["Law and disputes.","These terms follow the law that applies in [COURT / CITY]. Disputes go to the courts of [COURT / CITY]."],
["Contact.","[EMAIL], [PHONE]."]]},
ar:{intro:"تنطبق هذه الشروط على كل من يستخدم KRP Bazar، الذي يديره [OPERATOR NAME]، [ADDRESS]. بإنشاء حساب أو إتمام طلب فأنت توافق عليها.",items:[
["ما هو KRP Bazar.","منصة سوق إلكترونية. يعرض بائعون مستقلون منتجاتهم ويشتري العملاء منهم. عقد البيع بين العميل والبائع. توفر KRP Bazar المنصة ونظام الطلبات وخدمة العملاء."],
["الحسابات.","يجب إدخال اسم ورقم هاتف وبريد إلكتروني صحيحة، والحفاظ على سرية كلمة المرور. أنت مسؤول عما يحدث من حسابك. لكل شخص حساب واحد."],
["الطلبات والأسعار.","الأسعار بالدينار العراقي. يتم الطلب عند الضغط على تأكيد الطلب، وللبائع قبوله أو رفضه. قد تتغير الأسعار والمخزون حتى يؤكد البائع الطلب."],
["الدفع.","حالياً تدفع نقداً عند استلام الشحنة، مباشرة إلى البائع أو إلى المندوب الذي يسلّمها. لا تحصّل KRP Bazar ثمن البضاعة. قد تُضاف طرق دفع أخرى لاحقاً."],
["التوصيل.","يوصّل كل بائع شحناته بنفسه أو عبر مناديبه إلى العنوان الذي تدخله. موقع الخريطة مطلوب ليتمكن البائع من الوصول إليك. الطلب الذي يضم منتجات من عدة بائعين يُسلَّم في عدة شحنات، ولكل شحنة حالتها وموعد توصيلها الذي يحدده البائع ويمكنك متابعته في التطبيق، لذا قد تصل الشحنات في أيام مختلفة. يُحتسب التوصيل لكل بائع: مجاني عندما يبلغ مجموع منتجات البائع الواحد 100,000 دينار أو أكثر، ويكلف 3,000 دينار لما دون ذلك، ما لم يظهر التطبيق خلاف ذلك. تُدفع أجرة التوصيل للبائع الذي يوصّل. تحقق من العنوان وموقع الخريطة ورقم الهاتف."],
["الإرجاع والشكاوى.","يحق لك إرجاع الطلب أو الإبلاغ عن مشكلة خلال [RETURN DAYS] يوماً من التسليم إذا كان المنتج تالفاً أو خاطئاً أو غير مطابق للوصف. تواصل مع الدعم في التطبيق (حسابي، تواصل مع الدعم)."],
["البائعون.","يسجّل البائع متجراً توافق عليه KRP Bazar أو ترفضه أو توقفه. يلتزم البائع بوصف المنتجات بصدق، وإبقاء المخزون والأسعار محدثة، وتسليم ما طلبه العميل، ومعالجة الطلبات بسرعة. يوصّل البائع الشحنات ويستلم الدفع نقداً من العميل عند التسليم ويدفع لـ KRP Bazar عمولة على المبيعات المسلّمة، مبلغاً ثابتاً لكل قطعة حسب سعرها (500 دينار عن كل 25,000 دينار أو جزء منها من سعر القطعة، كما يظهر في التطبيق) ما لم يُتفق خلافه. تُسوّى العمولة مع KRP Bazar حسب الاتفاق مع البائع."],
["القسائم.","يسري رمز القسيمة على منتجات البائع الذي صدر له، ويمكن استخدامه مرة واحدة لكل عميل، وقد تنتهي صلاحيته أو يُسحب. لا يمكن للبائع استخدام قسيمته بنفسه. يُقسّم الخصم بين البائع وKRP Bazar كما يظهر في التطبيق أو كما يُتفق مع البائع."],
["الممنوعات.","يمنع عرض سلع غير قانونية أو مسروقة أو مقلدة أو خطرة أو تتطلب ترخيصاً دون ترخيص، ونشر تقييمات كاذبة، وإساءة معاملة المستخدمين أو إساءة استخدام المنصة. لـ KRP Bazar حذف المنتجات وحظر الحسابات المخالفة."],
["التقييمات.","يمكن فقط للعملاء الذين استلموا طلباً تقييم البائع. يجب أن تكون التقييمات صادقة ومحترمة، ولـ KRP Bazar حذف ما يخالف الشروط."],
["المسؤولية.","تبذل KRP Bazar عناية في تشغيل المنصة لكنها لا تضمن عملها دائماً دون أخطاء. البائعون مسؤولون عن منتجاتهم. وبقدر ما يسمح القانون لا تتحمل KRP Bazar خسائر ناتجة عن البائعين أو المناديب أو أمور خارج سيطرتها."],
["التعديل.","قد نغيّر هذه الشروط، والنسخة الحالية متوفرة دائماً في التطبيق. استمرار الاستخدام بعد التعديل يعني الموافقة."],
["القانون والنزاعات.","تخضع هذه الشروط للقانون المعمول به في [COURT / CITY]، وتحال النزاعات إلى محاكم [COURT / CITY]."],
["التواصل.","[EMAIL]، [PHONE]."]]}},
privacy:{
en:{intro:"This policy explains what data KRP Bazar, operated by [OPERATOR NAME], [ADDRESS], collects and how it is used.",items:[
["Data we collect.","Name, phone number, email address, password (stored only in protected form), delivery address, orders, favorites, cart, reviews, support messages and chat messages. Sellers also provide a shop name, a logo, a shop address, a shop phone number and product photos. If you attach your location to an order, we store a map link."],
["Why we use it.","To create your account, process and deliver orders, show order status, let customers rate sellers, answer support requests, prevent fraud and misuse, and run and improve the platform."],
["Who sees it.","The seller of an item you order sees your name, phone number, delivery address and, if you attach it, your location so they can prepare and hand over the order. The seller's couriers receive the same details to deliver it. Administrators of KRP Bazar can see accounts, orders and messages to run the platform. Your reviews are public together with your name. Chat messages can be read by the people in the chat and by the administrators of KRP Bazar. We do not sell your data."],
["Where it is stored.","Data is stored with our hosting provider Supabase and the app is hosted on GitHub Pages. These providers process data on our behalf."],
["How long we keep it.","We keep account and order data as long as your account exists and as long as needed for orders, complaints and legal duties. You can ask us to delete your account."],
["Your rights.","You can ask to see, correct or delete your data. Write to [EMAIL]. We answer within a reasonable time."],
["Security.","Passwords are stored in protected form, data travels over encrypted connections, and each user can only access the data the rules of the system allow. No system is completely safe, so please keep your password secret."],
["Children.","KRP Bazar is not meant for children under 18 without a parent or guardian."],
["Changes.","We may update this policy. The current version is in the app."],
["Contact.","[EMAIL], [PHONE]."]]},
ar:{intro:"تشرح هذه السياسة ما البيانات التي يجمعها KRP Bazar، الذي يديره [OPERATOR NAME]، [ADDRESS]، وكيف تُستخدم.",items:[
["البيانات التي نجمعها.","الاسم ورقم الهاتف والبريد الإلكتروني وكلمة المرور (تُحفظ بشكل محمي فقط) وعنوان التوصيل والطلبات والمفضلة والسلة والتقييمات ورسائل الدعم ورسائل المحادثة. كما يقدم البائعون اسم المتجر والشعار وعنوان المتجر ورقم هاتفه وصور المنتجات. إذا أرفقت موقعك بطلب فنحفظ رابط الخريطة."],
["لماذا نستخدمها.","لإنشاء حسابك، ومعالجة الطلبات وتوصيلها، وعرض حالة الطلب، ومنح العملاء حق تقييم البائعين، والرد على طلبات الدعم، ومنع الاحتيال وسوء الاستخدام، وتشغيل المنصة وتحسينها."],
["من يراها.","يرى بائع المنتج الذي تطلبه اسمك ورقم هاتفك وعنوان التوصيل وموقعك إن أرفقته لتحضير الطلب وتسليمه. يحصل مناديب البائع على البيانات نفسها للتوصيل. يمكن لمدراء KRP Bazar رؤية الحسابات والطلبات والرسائل لتشغيل المنصة. تظهر تقييماتك للجميع مع اسمك. يمكن لأطراف المحادثة ولمدراء KRP Bazar قراءة رسائل المحادثة. لا نبيع بياناتك."],
["أين تُخزّن.","تُخزّن البيانات لدى مزود الاستضافة Supabase، ويستضاف التطبيق على GitHub Pages. يعالج هذان المزودان البيانات نيابة عنا."],
["مدة الاحتفاظ.","نحتفظ ببيانات الحساب والطلبات طالما بقي حسابك وبقدر الحاجة للطلبات والشكاوى والالتزامات القانونية. يمكنك طلب حذف حسابك."],
["حقوقك.","يمكنك طلب الاطلاع على بياناتك أو تصحيحها أو حذفها عبر المراسلة على [EMAIL]. نرد خلال مدة معقولة."],
["الأمان.","تُحفظ كلمات المرور بشكل محمي، وتنتقل البيانات عبر اتصالات مشفرة، ولا يصل كل مستخدم إلا إلى ما تسمح به قواعد النظام. لا يوجد نظام آمن تماماً، لذا حافظ على سرية كلمة مرورك."],
["الأطفال.","لم يُصمم KRP Bazar للأطفال دون 18 سنة دون إشراف ولي الأمر."],
["التعديل.","قد نحدّث هذه السياسة، والنسخة الحالية في التطبيق."],
["التواصل.","[EMAIL]، [PHONE]."]]}}};

 var h='<form class="panel" id="eform" novalidate data-id="'+p.id+'"><b>'+t("editProduct")+'</b>'

function splitFor(items,sid){
 var g={},r={sales:0,comm:0,fee:0};
 items.forEach(function(i){var sh=i.shop_id||(S.shop&&S.shop.id);if(sh!==sid)return;(g[i.order_id]=g[i.order_id]||[]).push(i);
  if(i.status==="delivered"){r.sales+=i.unit_price_iqd*i.qty;r.comm+=commOf(i);}});
 Object.keys(g).forEach(function(k){var it=g[k],all=0,live=it.filter(function(i){return i.status!=="cancelled";});
  it.forEach(function(i){all+=i.unit_price_iqd*i.qty;});
  if(live.length&&live.every(function(i){return i.status==="delivered";})){var pf1=pfOf(k,sid);r.fee+=pf1?((pf1.status==="fixed"||pf1.status==="accepted")?pf1.fee_iqd:0):(all>=100000?0:3000);}});
 var ds=Math.round(discByShop(items)[sid]||0),dp=Math.round(discPlat(items)[sid]||0),comm=Math.round(r.comm);
 return {cash:Math.round(r.sales)+r.fee-ds-dp,merch:Math.round(r.sales)-comm-ds,deliv:r.fee,admin:comm-dp};}

function hav(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(q));}

 var d="";if(cll){var p=cll.split(",");var km=hav(tr.lat,tr.lng,parseFloat(p[0]),parseFloat(p[1]));d=t("p41Away").replace("{d}",km<1?num(Math.round(km*1000))+" m":num(km.toFixed(1))+" km")+" · ";}

 return '<div class="panel"><div class="sum"><b>⚡ '+t("p40Offer")+'</b><span class="pill">'+t(on?"p40On":"p40Off")+'</span></div><div class="from">'+t("p40OfferSub")+'</div><button class="btn'+(on?' ghost':'')+'" type="button" data-act="expsw">'+t(on?"p40TurnOff":"p40TurnOn")+'</button></div>';}
function shopLocCard(){
 var ll=llOf(S.shop.loc_url);
 if(!ll)return '<div class="panel"><div class="msg"><b>📍 '+t("p29ShopLocMiss")+'</b><div class="from">'+t("p29ShopLocSub")+'</div></div><button class="btn" type="button" data-act="sgeo">📍 '+t("p29ShopLocBtn")+'</button></div>';
 return '<div class="panel"><b>📍 '+t("p29ShopLoc")+'</b><div class="from" dir="ltr" style="text-align:start">'+ll+'</div><iframe class="locmap" loading="lazy" title="map" src="https://maps.google.com/maps?q='+ll+'&z=17&output=embed"></iframe><button class="btn ghost" type="button" data-act="sgeo">↻ '+t("p29ShopLocUpd")+'</button></div>';}

function catPicker(id,sel,list){
 var groups=[],map={};
 list.forEach(function(c){var p=c.parent_id?cat(c.parent_id):null,k=p?catLabel(p):"";if(!map.hasOwnProperty(k)){map[k]={h:k,items:[]};groups.push(map[k]);}map[k].items.push(c);});
 return '<input type="hidden" id="'+id+'" value="'+esc(sel||"")+'"><div class="cpick" data-for="'+id+'" role="group" aria-label="'+esc(t("category"))+'">'
  +groups.map(function(g){return (g.h?'<h4>'+esc(g.h)+'</h4>':'')+'<div class="cgrid">'+g.items.map(function(c){var on=c.id===sel;return '<button type="button" class="ctile'+(on?' on':'')+'" data-act="catpick" data-id="'+id+'" data-v="'+esc(c.id)+'" aria-pressed="'+on+'">'+cicon(c)+'<span>'+esc(L(c,"name"))+'</span></button>';}).join("")+'</div>';}).join("")+'</div>';}
/* ---------- Events ---------- */
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-act],[data-go],[data-p],[data-fav],[data-lang2],[data-add],[data-qadd],[data-q],[data-auth],#logo,#logout,#retry,#langs button");if(!el)return;
 if(el.dataset.act){doAct(el);return;}
 if(el.id==="logo"){S.q="";$("q").value="";go("home");return;}
 if(el.id==="retry"){S.ready=false;render();loadPublic().then(render);return;}
 if(el.id==="logout"){sb.auth.signOut().then(function(){S.authMsg="";go("home");});return;}
 if(el.dataset.l){S.lang=el.dataset.l;saveLang();render();return;}
 if(el.dataset.auth){S.authMode=el.dataset.auth;S.authErr="";S.authMsg="";render();return;}
 if(el.dataset.go){if(/^cat-/.test(el.dataset.go)&&el.classList.contains("cat")){el.classList.add("tap");setTimeout(function(){go(el.dataset.go);},130);return;}go(el.dataset.go);return;}
 if(el.dataset.p){var cd=el.closest(".card");if(cd&&!window.matchMedia("(prefers-reduced-motion:reduce)").matches){cd.classList.add("zoomout");setTimeout(function(){go("p-"+el.dataset.p);},150);return;}go("p-"+el.dataset.p);return;}
 if(el.dataset.lang2){S.lang=el.dataset.lang2;saveLang();render();return;}
 if(el.dataset.fav){toggleFav(+el.dataset.fav);return;}
 if(el.dataset.add){addToCart(+el.dataset.add);return;}
 if(el.dataset.qadd){addToCart(+el.dataset.qadd);return;}
 if(el.dataset.q){changeQty(+el.dataset.q,el.dataset.s||"",+el.dataset.d);return;}
});
document.addEventListener("change",function(e){if(e.target.dataset&&e.target.dataset.cact){doChange(e.target);return;}if(e.target.id==="p-cat"||e.target.id==="e-cat"){resizeBox(e.target.id==="p-cat"?"p":"e",e.target.value);return;}if(e.target.id==="sort"){S.sort=e.target.value;keepScroll();}});
document.addEventListener("submit",async function(e){
 e.preventDefault();
 if(e.target.id==="rform"){return doRequest();}
 if(e.target.id==="eform"){return doErrand();}
 if(S.busy)return;
 if(e.target.id==="bform"){return doAddBanner();}
 if(e.target.id==="eform"){return doEditProduct();}
 if(e.target.id==="msgform"){return doSend();}
 if(e.target.id==="cpform"){return doAddCoupon();}
 if(e.target.id==="forgot"){return doForgot();}
 if(e.target.id==="recov"){return doRecov();}
 if(e.target.id==="rateform"){return doRate();}
 if(e.target.id==="cmpl"){return doComplete();}
 if(e.target.id==="accform"){return doProfileSave();}
 if(e.target.id==="osform"){return osearch($("os-q").value);}
 if(e.target.id==="pwform"){return doPw();}
 if(e.target.id==="supform"){return doSupport();}
 if(e.target.id==="shopreg"){return doShopReg();}
 if(e.target.id==="pform"){return doAddProduct();}
 if(e.target.id==="auth"){
  var em=$("a-email").value.trim(),pw=$("a-pass").value,reg=S.authMode==="register";
  if(!em||!pw){$("aerr").textContent=t("fillAll");return;}
  if(reg&&(!$("a-name").value.trim()||$("a-phone").value.replace(/\D/g,"").length<8)){$("aerr").textContent=t("phoneBad");return;}
  if(reg&&pw.length<6){$("aerr").textContent=t("pwHint");return;}
  if(reg&&!$("a-terms").checked){$("aerr").textContent=t("mustAccept");return;}
  S.busy=true;S.authErr="";S.authMsg="";
  var r;
  if(reg)r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$("a-name").value.trim(),phone:$("a-phone").value.trim(),terms_accepted:true}}});
  else r=await sb.auth.signInWithPassword({email:em,password:pw});
  S.busy=false;
  if(r.error){S.authErr=r.error.message;render();return;}
  if(reg&&!r.data.session){S.authMode="login";S.authMsg=t("checkEmail");render();return;}
  await loadUser();S.authMsg="";go("home");
  return;
 }
 if(e.target.id==="chk"){
  var v=["f-name","f-phone","f-city","f-addr"].map(function(i){return i==="f-city"?cityVal("f"):$(i).value.trim();});
  if(!v[2]){$("err").textContent=t("p33CityBad");return;}
  if(v.some(function(x){return !x;})){$("err").textContent=t("fillAll");return;}
  if(!S.geo){var lc=$("geo-card");if(lc){lc.classList.remove("shake");void lc.offsetWidth;lc.classList.add("shake");lc.scrollIntoView({behavior:"smooth",block:"center"});}$("err").textContent=t("locRequired");return;}
  var xsel=Array.prototype.slice.call(document.querySelectorAll(".xp:checked")).map(function(x){return x.value;});
  S.busy=true;
  var r2=await sb.rpc("place_order",{p_name:v[0],p_phone:v[1],p_city:v[2],p_address:v[3],p_loc:S.geo||null,p_coupon:S.coupon?S.coupon.code:null});
  S.busy=false;
  if(r2.error){render();var er=$("err");if(er)er.textContent=errText(r2.error);return;}
  S.expSent=[];for(var xi=0;xi<xsel.length;xi++){try{var xr=await sb.rpc("request_express",{p_order:r2.data,p_shop:xsel[xi]});if(!xr.error)S.expSent.push(xsel[xi]);}catch(e7){}}
  var o=await sb.from("orders").select("*,order_items(*)").eq("id",r2.data).single();
  S.order=o.data;S.cart=[];try{await sb.rpc("save_address",{p_name:v[0],p_phone:v[1],p_city:v[2],p_addr:v[3],p_loc:S.geo});}catch(e6){}S.geo=null;S.geoAcc=0;S.coupon=null;try{await loadUser();}catch(e5){}
  await loadPublic();
  go("done");
 }
});
$("q").addEventListener("input",function(e){S.q=e.target.value;clearTimeout(histT);histT=setTimeout(function(){histAdd(S.q);},1400);if(route()==="search")render();else go("search");});
$("q").addEventListener("keydown",function(e){if(e.key==="Enter"){clearTimeout(histT);histAdd(S.q);e.target.blur();}});
$("q").addEventListener("focus",function(){if(!S.q.trim()&&route()!=="search")go("search");});
window.addEventListener("hashchange",onRoute);
sb.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){S.recovery=true;setTimeout(function(){loadUser().then(function(){go("account");render();});},0);return;}if(ev==="SIGNED_OUT"){setTimeout(function(){S.geo=null;S.geoAcc=0;S.user=null;S.profile=null;S.cart=[];S.favs=[];S.orders=[];S.shop=null;S.items=[];S.newCnt=0;S.unread=0;S.convs=[];S.chat=null;stopChatPoll();render();},0);}});
render();
setInterval(function(){pollLive().catch(function(){});},10000);
setInterval(beat,60000);document.addEventListener("visibilitychange",beat);setTimeout(beat,4000);
Promise.all([loadPublic(),loadUser()]).then(onRoute).catch(function(){S.ready=true;S.loadErr=true;render();});
})();
</script>
